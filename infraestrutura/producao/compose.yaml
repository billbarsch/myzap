name: myzap

services:
  banco:
    image: mariadb:11
    container_name: myzap-banco
    restart: unless-stopped
    env_file:
      - /srv/myzap/configuracao/banco.env
    volumes:
      - /srv/myzap/mariadb:/var/lib/mysql
    networks:
      - myzap-interna
    mem_limit: 384m
    cpus: '0.50'
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  aplicacao:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: myzap-aplicacao
    container_name: myzap-aplicacao
    restart: unless-stopped
    env_file:
      - /srv/myzap/configuracao/aplicacao.env
    depends_on:
      banco:
        condition: service_healthy
    volumes:
      - /srv/myzap/storage:/var/www/html/storage
    networks:
      - myzap-interna
      - rede_publica
    mem_limit: 384m
    cpus: '0.50'
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen("127.0.0.1",80); exit($$s ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  myzap-interna:
    name: myzap-interna
  rede_publica:
    external: true
    name: rede_publica