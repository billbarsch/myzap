name: myzap

services:
  banco:
    image: mariadb:11
    container_name: myzap-banco
    restart: unless-stopped
    env_file:
      - /srv/myzap/configuracao/banco.env
    volumes:
      - /srv/myzap/mariadb:/var/lib/mysql
    networks:
      - myzap-interna
    mem_limit: 384m
    cpus: '0.50'
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  aplicacao:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: myzap-aplicacao
    restart: unless-stopped
    env_file:
      - /srv/myzap/configuracao/aplicacao.env
    depends_on:
      banco:
        condition: service_healthy
    networks:
      - myzap-interna
      - rede_publica
    mem_limit: 384m
    cpus: '0.50'
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/api/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

networks:
  myzap-interna:
    name: myzap-interna
  rede_publica:
    external: true